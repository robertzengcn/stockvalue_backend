[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
pythonpath = .
markers =
    l1_formula: L1 formula verification tests (paper reference values)
    l2_mapping: L2 field mapping verification tests (frozen AKShare JSON, no network)
    golden: L3 end-to-end golden pipeline tests (frozen data, no network)
    golden_live: L3 golden tests against live AKShare API (requires network, run weekly)
addopts =
    --cov=stockvaluefinder
    --cov-report=html
    --cov-report=term-missing
    -v
